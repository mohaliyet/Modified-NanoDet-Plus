[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanodet"
version = "1.0.0"
description = "Modified NanoDet-Plus for conformal risk control"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "NanoDet Contributors"}
]
keywords = [
    "deep-learning",
    "object-detection",
    "conformal-risk-control",
    "uncertainty-quantification",
    "pytorch",
    "pytorch-lightning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pytorch-lightning>=2.0.0",
    "torchmetrics>=1.0.0",
    "Cython>=0.29.0",
    "imagesize>=1.4.0",
    "matplotlib>=3.5.0",
    "numpy>=1.24.0,<2.0",
    "omegaconf>=2.3.0",
    "opencv-python-headless>=4.8.0",
    "pyaml>=21.10.0",
    "pycocotools>=2.0.6",
    "tabulate>=0.9.0",
    "tensorboard>=2.11.0",
    "termcolor>=2.0.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
]

export = [
    "onnx>=1.15.0",
    "onnx-simplifier>=0.4.0",
]

all = [
    "nanodet[dev,export]",
]

[project.urls]
Homepage = "https://github.com/Para-Sight/Modified-NanoDet-Plus"
Repository = "https://github.com/Para-Sight/Modified-NanoDet-Plus"
Issues = "https://github.com/Para-Sight/Modified-NanoDet-Plus/issues"
Documentation = "https://github.com/Para-Sight/Modified-NanoDet-Plus#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanodet*"]
exclude = ["tests*", "tools*", "config*", "data*"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=nanodet",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.coverage.run]
source = ["nanodet"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
